<style>

.rt>div{flex:1;min-width:0}.rt b{display:block}

.hm{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-template-columns:repeat(53,1fr);gap:2px}
.ml{display:grid;grid-template-columns:repeat(53,1fr);gap:2px;font-size:9px;color:var(--mut);height:14px;white-space:nowrap}

.nv{display:flex;align-items:center;gap:6px;font-size:13px}.nv button{border:0;background:none;padding:6px 8px;font-size:16px}

.big{font-size:36px;font-weight:800}
.mn{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:18px 16px;margin-bottom:12px}
.mn b{display:block;font-size:18px}.mn span{font-size:20px;color:var(--mut)}
.li{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 2px}
.li:last-child{border:0}.li div{flex:1}.dot{width:14px;height:14px;border-radius:50%;flex:none}
.tl{border-left:2px solid var(--line);margin:14px 0 0 7px;padding-left:18px}
.tl .rt{position:relative;margin-bottom:10px}.tl .rt:before{content:"";position:absolute;left:-28px;top:50%;width:12px;height:12px;border-radius:50%;background:var(--c);transform:translateY(-50%)}
.tl .rt.on{opacity:.55}
.sel{width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:14px;font-weight:600;appearance:none;-webkit-appearance:none}
.ring{display:block;margin:10px auto}.ring text{fill:var(--fg)}
.ct{display:flex;justify-content:center;align-items:center;gap:22px;margin:6px 0 16px}
.ct button{width:48px;height:48px;border:0;background:none;font-size:22px}.ct .m{width:68px;height:68px;border-radius:50%;background:var(--fg);color:var(--bg);font-size:26px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sw{position:relative;width:50px;height:30px;background:var(--line);border-radius:15px;border:0;padding:0;flex:none}.sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.15s}.sw.on{background:var(--fg)}.sw.on:after{left:23px;background:var(--bg)}
.dd{position:relative;margin-bottom:14px}.dd>button{display:flex;justify-content:space-between;align-items:center;width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px 16px;font-weight:600}.dd small{font-weight:400;margin-left:8px}.dd .ch{font-size:12px;color:var(--mut)}.dd.o .ch{display:inline-block;transform:rotate(180deg)}
.ddl{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:5;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 8px 24px #0003}.ddl button{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:14px 16px;text-align:left;font-weight:600}.ddl button:last-child{border:0}.ddl .a{background:var(--soft)}
.rr{display:flex;justify-content:space-between;gap:10px;width:100%;border:0;background:none;padding:8px 8px;font-size:14px;text-align:left;border-radius:8px}.rr.s{background:var(--soft)}.wk .c.s{outline:2px solid var(--fg);outline-offset:1px}

svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.sc{position:absolute;inset:0;background:#0006}
.sb{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--bg);border-radius:20px 20px 0 0;padding:20px 20px calc(env(safe-area-inset-bottom,0px) + 20px);max-height:90vh;overflow:auto}
.sb label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
.dc{display:flex;gap:6px;margin-top:8px}.dc button{flex:1;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card)}.dc .on{background:var(--fg);color:var(--bg)}.ig{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}.igt{display:flex;gap:6px;overflow-x:auto;margin-top:10px;scrollbar-width:none}.igt::-webkit-scrollbar,.sb::-webkit-scrollbar{display:none}.sb{scrollbar-width:none}.igt button{flex:none;padding:6px 12px;border-radius:16px;border:1px solid var(--line);background:var(--card);font-size:13px}.igt .on{background:var(--fg);color:var(--bg);border-color:var(--fg)}.ig button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:20px}.sb .ck2{display:flex;align-items:center;gap:10px;font-size:16px;color:var(--fg);margin:10px 0}.sb input[type=checkbox]{width:22px;min-height:22px;height:22px}.sb textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;font-size:16px}
.sb input,.sb select{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;font-size:16px;min-height:46px}
.sb input[type=color]{padding:3px}
#ts{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;z-index:10;display:none;max-width:90%}
.card,.rt,.gh,.mn,.dd>button,.sel,nav .in{box-shadow:var(--sh)}.ddl{box-shadow:0 10px 28px #0000004d}
.btn.gr{background:#8e8e93;border-color:#8e8e93;color:#fff}.rg{width:100%;accent-color:var(--fg);margin:8px 0}
select.sel{padding-right:38px;background:var(--card) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%23888' stroke-width='1.6'/></svg>") no-repeat right 14px center}
.hd{display:flex;align-items:center;gap:12px;margin:8px 0 20px}.hd h1{margin:0;flex:1;font-size:26px;letter-spacing:-.5px}.hd .ib{flex:none}.ib svg.i{width:22px;height:22px}

.dh{flex:none;width:28px;height:40px;border:0;background:none;color:var(--mut);font-size:20px;touch-action:none;cursor:grab;padding:0;-webkit-user-select:none;user-select:none}.stp{transition:transform .12s;position:relative}.stp.drag{transition:none;z-index:3;background:var(--bg);box-shadow:var(--sh);border-radius:12px}
</style>
</head>
<body>

<script>
